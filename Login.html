<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack AI Login</title>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
        /* display: flex; */
        /* justify-content: center; */
        /* align-items: center; */
        /* height: 100vh; */
        /* margin: 0; */
   .background{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:url(stethoscope-on-white-background-photo.jpg);
    background-size:cover;
    background-position:center;

    filter:blur(0.1px);
    transform:scale(1.1);

    z-index:-2;
}
        body{
    margin:0;
    overflow:hidden;
}

.background::after{
    content:"";
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(40,100,180,.18);
}

   

    .container{
    position: relative;
    z-index: 1;

    display:flex;
    justify-content:space-between;
    align-items:center;
    height:100vh;
    padding:80px;
}
.left{
    width:45%;

    display:flex;
    justify-content:center;
}
.right{
    width:45%;
    color:white;
}
.right h1{
    font-size:60px;
    margin-bottom:20px;
}

.right p{
    font-size:24px;
    line-height:40px;
}
    .login-box{
    width:360px;
    padding:30px 24px;

    background: rgba(13, 110, 253, 0.25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            color: white;
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
    color: white;
    font-weight: 600;
}
.login-box label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
    color: rgba(255, 255, 255, 0.9);
}

.login-box input{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:16px;
    outline:none;
     border:none;
   background:transparent;
   color:white;
   width:100%;
   margin:0;

}
.input-box{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.35);
    border-radius:15px;
    padding:0 15px;
    margin-bottom:20px;
    transition: 0.3s;
}
.input-box i{
    color:white;
    font-size:18px;
    margin-right:10px;
}
.input-box input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    padding:15px 0;
    font-size:16px;
}

.input-box input::placeholder{
    color:#eeeeee;
}
.login-box input:focus{
    border:2px solid #2563eb;
}

.login-box button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background: linear-gradient(to right,#2563eb,#14b8a6);
    font-size : 18px;
    cursor:pointer;
    transition:0.3s;
    color:white;
} 
.login-box button:hover{
    transform: scale(1.03);
    text-decoration: underline;
}
.login-box p{
    text-align: center;
    margin-top: 20px;
}
.login-box a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}
.right-content{
    color:rgb(255, 255, 255);
    width:45%;
}
.right-content h3{
    font-size:26px;
    margin-bottom:20px;
    margin-top: -20px;
    color: #145eb8;
}
.right-content p{
    font-size:18px;
    line-height:35px;
}

    
</style>
<body>
    <div class="background">
    <div class="container">

    <div class="login-box">

    <h1>Login</h1>

    <label>Username</label>
    <input type ="text" placeholder="Enter Username">

    <label>Email</label>
    <input type="text" placeholder="Enter Email">

    <button>Login</button>
    <p>Don't have an account?
        <a href="#">Register</a></p>
    </div>
    
    <div class="right-content">

        <h1>Your Health,<br>Our Priority</h1>
<p>
Track your daily health, analyze your weekly progress,
and receive AI-powered health insights.
</p>

</div>

</div>
</div>

</body>
</html>
