<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HealthTrack AI Login</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: url("stethoscope-on-white-background-photo.jpg");
            background-size: cover;
            background-position: center;

            filter: blur(0.1px);
            transform: scale(1.1);

            z-index: -2;
        }

       .background::after {
    content: "";
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(40, 100, 180, 0.18);

    pointer-events: none;
}

        .container {
            position: relative;
            z-index: 1;

            display: flex;
            justify-content: space-between;
            align-items: center;

            height: 100vh;
            padding: 80px;
        }

        .left {
            width: 45%;

            display: flex;
            justify-content: center;
        }

        .right {
            width: 45%;
            color: white;
        }

        .right h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .right p {
            font-size: 24px;
            line-height: 40px;
        }

        .login-box {
            width: 360px;
            padding: 30px 24px;

            background: rgba(13, 110, 253, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);

            color: white;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 25px;
            color: white;
            font-weight: 600;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;

            border: none;
            border-radius: 12px;

            font-size: 16px;
            outline: none;

            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .login-box input::placeholder {
            color: #eeeeee;
        }

        .login-box input:focus {
            border: 2px solid #2563eb;
        }

        .login-box button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(to right, #2563eb, #14b8a6);

            font-size: 18px;
            cursor: pointer;

            transition: 0.3s;
            color: white;
        }

        .login-box button:hover {
            transform: scale(1.03);
            text-decoration: underline;
        }

        .login-box p {
            text-align: center;
            margin-top: 20px;
        }

        .login-box a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .right-content {
            color: rgb(255, 255, 255);
            width: 45%;
        }

        .right-content h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .right-content p {
            font-size: 18px;
            line-height: 35px;
        }

        @media (max-width: 900px) {
            .container {
                padding: 30px;
            }

            .right-content {
                display: none;
            }

            .login-box {
                width: 100%;
                max-width: 360px;
            }

            .left {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="background">

        <div class="container">

            <div class="left">

                <div class="login-box">

                    <h1>Login</h1>

                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter Username"
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                    >

                    <button type="button" id="loginButton">
                        Login
                    </button>

                    <p>
                        Don't have an account?
                        <a href="#">Register</a>
                    </p>

                </div>

            </div>

            <div class="right-content">

                <h1>
                    Your Health,<br>
                    Our Priority
                </h1>

                <p>
                    Track your daily health, analyze your weekly progress,
                    and receive AI-powered health insights.
                </p>

            </div>

        </div>

    </div>


    <!-- LOGIN FUNCTION -->
    <script>
        document.getElementById("loginButton").addEventListener("click", function () {

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();

            // Check username
            if (username === "") {
                alert("Please enter your username.");
                return;
            }

            // Check email
            if (email === "") {
                alert("Please enter your email.");
                return;
            }

            // Basic email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address.");
                return;
            }

            // Save login information
            localStorage.setItem("healthTrackUsername", username);
            localStorage.setItem("healthTrackEmail", email);

            // Go to Dashboard
            window.location.href = "Dashboard.html";
        });
    </script>

</body>
</html>
