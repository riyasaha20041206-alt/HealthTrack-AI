<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:url("stethoscope-on-white-background-photo.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.15);
}

.container{
   
    position:relative;
    z-index:1;
    display:flex;
    justify-content:flex-start;   /* center-এর বদলে */
    align-items:center;
    min-height:100vh;
    padding-left:80px;
}


.dashboard{
    width:670px;
    background:rgba(13, 110, 253, 0.25);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:50px;
    padding:15px ;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.dashboard h1{
    color:white;
    text-align:center;
    margin-bottom:10px;
    font-size:35px;
}

.dashboard p{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

.form-grid{
    display:grid;
   grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-group{
   display:flex;

    flex-direction:column;
}

.input-group label{
    color:white;

    font-size:20px;

    font-weight:600;

    margin-bottom:10px;
}

.input-group input{
     height:50px;

     width:100%;

     font-size: 16px;

    border:none;

    border-radius:15px;

    padding-left:18px;

    background:rgba(255,255,255,.22);

    color:white;

    font-size:18px;

}
.input-group select{

    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,.20);
    color:white;
    font-size:16px;
}

.input-group input::placeholder{
    color:#eeeeee;
}
button{ 
width:100%;
    padding:18px;
    border:none;
    margin-top: 30px;
    border-radius:20px;
    background: linear-gradient(to right,#2563eb,#14b8a6);
    font-size : 18px;
    cursor:pointer;
    transition:0.3s;
    color:white;
}
button:hover{

    transform:translateY(-3px);

}

.fa-weight-scale{

    color:#8b5cf6;

}

.fa-stethoscope{

    color:#14b8a6;

}

.fa-droplet{

    color:#ef4444;

}

.fa-heart-pulse{

    color:#ec4899;

}

.fa-bed{

    color:#4f46e5;

}

.fa-glass-water{

    color:#0ea5e9;

}

</style>

<body>
    <div class="container">
     <div class="dashboard">

        <h1>Today's Health Report</h1>

        <div class="form-grid">

    <div class="input-group">
        <label><i class="fa-solid fa-weight-scale"></i> Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter Weight">
    </div>

    <div class="input-group">
        <label><i class="fa-solid fa-stethoscope"></i> Blood Pressure</label>
        <input type="text" id="bloodPressure" placeholder="120/80">
    </div>

    <div class="input-group">
        <label><i class="fa-solid fa-droplet"></i> Blood Sugar</label>
        <input type="number" id="bloodSugar" placeholder="Enter Blood Sugar">

    </div>

    <div class="input-group">
        <label><i class="fa-solid fa-heart-pulse"></i> Heart Rate</label>
        <input type="number" id="heartRate" placeholder="Enter Heart Rate">

    </div>

    <div class="input-group">
        <label><i class="fa-solid fa-glass-water"></i> Water Intake</label>
        <input type="number" id="waterIntake" placeholder="Litres">
    </div>

    <div class="input-group">
        <label><i class="fa-solid fa-bed"></i> Sleep Hours</label>
        <input type="number" id="sleepHours" placeholder="Enter Sleep Hours">
    </div>
     </div>
<button id="saveBtn">
    <i class="fa-solid fa-floppy-disk"></i>
    Save Today's Report
</button>


</div>
</div>
     <script src ="script.js"></script>
       </body>
     
</html>
